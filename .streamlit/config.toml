# Housemade's Sky look: bold colour tiles, with a matching dark version for devices in dark mode.
# See specs/design.md. The tile colours and shapes are in screens/sky.py and screens/sky.css.

[theme]
font = "Bricolage Grotesque:https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700;800&display=swap"
headingFontWeights = [800, 700, 700, 700, 700, 700]
baseFontSize = 18                    # Streamlit uses 16; bigger reads better on phones
baseRadius = "1rem"
buttonRadius = "full"
showSidebarBorder = false

[theme.light]
primaryColor = "#2346D8"             # cobalt: buttons, checkboxes, links
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF1F8" # inputs and the sidebar
textColor = "#14213D"                # deep navy
borderColor = "#D7DBE6"
linkColor = "#2346D8"

[theme.dark]
primaryColor = "#2F52E8"             # keeps white button text readable
backgroundColor = "#0E1426"
secondaryBackgroundColor = "#1A2340"
textColor = "#F2F5FF"
borderColor = "#2A3557"
linkColor = "#8EA4FF"
