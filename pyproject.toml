[project]
name = "housemade"
version = "0.1.0"
description = "Chores, shopping and a shared fund for your flat"
requires-python = ">=3.12"
dependencies = [
    "authlib==1.9.8",
    "cryptography==48.0.1",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.12",
    "sqlalchemy==2.0.44",
    "streamlit==1.67.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
